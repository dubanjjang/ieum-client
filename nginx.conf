# =============================================================
# 가상 서버 블록(server block).
#   - nginx에서 "하나의 사이트(=가상 호스트)"를 정의하는 단위.
#   - 우리 컨테이너는 사이트가 하나뿐이라 server 블록도 1개면 됨.
# =============================================================
server {
  # 이 server가 listen할 TCP 포트.
  #   - 컨테이너 내부의 80번 포트.
  #   - 외부 노출은 docker run -p 8080:80 처럼 호스트 포트 매핑으로 함.
  listen 80;

  # 정적 파일을 찾을 디스크상의 루트 경로.
  #   - Dockerfile의 `COPY dist/ /usr/share/nginx/html/` 와 짝.
  #   - 클라가 GET /foo.js 를 요청하면 /usr/share/nginx/html/foo.js를 찾는다.
  root /usr/share/nginx/html;

  # 디렉터리 요청(예: GET /)이 들어왔을 때 자동으로 보여줄 파일.
  #   - SPA에서 진입점 = index.html.
  index index.html;

  # ─────────────────────────────────────────────────────────
  # gzip 압축 (앞단 리버스 프록시가 gzip을 처리하므로 비활성화).
  # 앞단 RP에서 gzip을 안 한다면 아래 블록의 주석을 해제해 사용.
  # 이중 압축은 의미가 없을 뿐 아니라 RP가 풀고 다시 압축하는
  # 비용이 들 수 있어, 한쪽에서만 켜는 것이 권장된다.
  # ─────────────────────────────────────────────────────────
  # gzip on;
  # gzip_vary on;
  # gzip_min_length 1024;
  # gzip_comp_level 5;
  # gzip_types
  #   text/css
  #   text/javascript
  #   application/javascript
  #   application/json
  #   image/svg+xml;

  # ─────────────────────────────────────────────────────────
  # 정적 자산 캐시 정책 — /assets/ 경로
  # Vite는 빌드 시 dist/assets/ 아래에 파일명을 해시로 만든다.
  # 예: dist/assets/index-DhA9p2Bs.js
  # 즉 내용이 바뀌면 파일명이 바뀌므로, 한 번 받은 파일은 영원히 캐시해도 안전.
  # ─────────────────────────────────────────────────────────
  location /assets/ {
    # 1년 뒤에 만료되는 Expires 헤더 자동 설정.
    expires 1y;

    # immutable: "이 응답은 절대 안 바뀐다"고 브라우저에 알려줘서
    # 사용자가 새로고침해도 서버에 재검증 요청을 안 보내게 함(아주 빠름).
    add_header Cache-Control "public, immutable";

    # 요청 경로의 파일이 실제로 존재하면 서빙, 아니면 404.
    #   - 여기선 SPA fallback 안 함. /assets/notexist.js는 그냥 404가 맞다.
    try_files $uri =404;
  }

  # ─────────────────────────────────────────────────────────
  # PWA(Progressive Web App) 관련 파일들 — 절대 캐시하면 안 되는 것들
  # 이 파일들은 파일명이 고정인데 내용이 자주 바뀐다.
  # 캐시되면 사용자가 새 버전을 영영 못 받는 사고가 난다.
  #   - location = /xxx 의 `=`은 "정확히 이 경로일 때만" 매칭(가장 빠른 매칭).
  # ─────────────────────────────────────────────────────────
  # Service Worker 본체 (Workbox 자동 생성)
  location = /sw.js              { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  # SW 등록 도우미 스크립트
  location = /registerSW.js      { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  # PWA 매니페스트(앱 이름/아이콘/색상 등 정의)
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # ─────────────────────────────────────────────────────────
  # SPA(Single Page Application) fallback — 가장 중요한 한 줄!
  # React Router는 클라 사이드 라우팅이라 /home, /mypage 같은 URL에
  # 대응하는 실제 파일이 서버에 없다.
  # 사용자가 /mypage 로 새로고침하면 서버는 그 파일을 못 찾아 404를 줘야
  # 하지만, 그러면 SPA 동작이 깨짐.
  # → 그래서 "파일이 없으면 index.html로 보내라"고 시킨다.
  #   index.html이 로드되면 그 안의 React Router가 URL을 보고 적절한
  #   페이지를 그려준다.
  # ─────────────────────────────────────────────────────────
  location / {
    # try_files: 왼쪽부터 차례로 시도, 마지막은 fallback.
    #   $uri        : 요청 경로와 일치하는 파일이 있으면 그걸 줌
    #   $uri/       : 디렉터리면 그 안의 index 파일을 줌
    #   /index.html : 둘 다 없으면 index.html을 줌(=SPA fallback)
    try_files $uri $uri/ /index.html;

    # index.html은 항상 최신본을 받게(절대 영구 캐시 금지).
    #   - "no-cache"는 "캐시는 하되 매번 서버에 재검증해라" 뜻.
    #   - 실제 본문 파일들은 해시 파일명이라 그쪽이 캐시되면 됨.
    add_header Cache-Control "no-cache";
  }

  # ─────────────────────────────────────────────────────────
  # 헬스체크 엔드포인트.
  #   - Dockerfile의 HEALTHCHECK가 이 경로로 wget을 날린다.
  #   - 200 ok 만 떨어뜨려 주면 충분.
  # ─────────────────────────────────────────────────────────
  location = /healthz {
    # 헬스체크 요청은 access.log를 어지럽히므로 로깅 끔.
    access_log off;
    # 200 상태 + "ok\n" 본문 즉시 반환(파일 디스크 IO 없음).
    return 200 "ok\n";
  }
}
